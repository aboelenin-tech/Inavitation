<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ibrahim &amp; Noha – Katb Ketab</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4ecd8;--paper2:#ebdfc2;--ink:#2b1d14;--wine:#7a1f2b;--gold:#a67c37;--muted:#6d5a48;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#241a14;--paper2:#1b130e;--ink:#f0e4cb;--wine:#d98a94;--gold:#cfa459;--muted:#b5a287}}
:root[data-theme="dark"]{--paper:#241a14;--paper2:#1b130e;--ink:#f0e4cb;--wine:#d98a94;--gold:#cfa459;--muted:#b5a287}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;padding:22px 14px;background:var(--paper2);color:var(--ink);font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;text-align:center}
body.ar{font-family:"Amiri","Times New Roman",serif}
.card{position:relative;max-width:540px;width:100%;padding:44px 28px 38px;background:radial-gradient(ellipse at center,var(--paper) 55%,var(--paper2) 130%);
border:3px double var(--gold);outline:1px solid var(--gold);outline-offset:-12px;box-shadow:0 10px 40px rgba(0,0,0,.18)}
.corner{position:absolute;width:46px;height:46px;color:var(--gold)}
.tl{top:6px;inset-inline-start:6px}.tr{top:6px;inset-inline-end:6px;transform:scaleX(-1)}
.bl{bottom:6px;inset-inline-start:6px;transform:scaleY(-1)}.br{bottom:6px;inset-inline-end:6px;transform:scale(-1,-1)}
[dir=rtl] .tl{transform:scaleX(-1)}[dir=rtl] .tr{transform:none}[dir=rtl] .bl{transform:scale(-1,-1)}[dir=rtl] .br{transform:scaleY(-1)}
.lang{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:var(--paper);border:1px solid var(--gold);color:var(--gold);padding:3px 16px;cursor:pointer;font:inherit;font-size:15px}
.bis{font-family:"Amiri",serif;font-size:26px;color:var(--wine);margin:6px 0 16px}
.small{font-size:17px;font-style:italic;color:var(--muted);line-height:1.6;max-width:380px;margin:0 auto}
body.ar .small{font-style:normal;font-size:20px}
.rule{display:flex;align-items:center;gap:12px;color:var(--gold);margin:20px auto;max-width:300px}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:var(--gold)}
h1{font-weight:600;font-size:clamp(40px,12vw,60px);line-height:1.1;margin:6px 0;color:var(--wine)}
h1 em{display:block;font-size:.4em;font-weight:500;color:var(--gold);margin:4px 0}
body.ar h1{font-family:"Amiri",serif;font-weight:700}
.date{font-size:24px;letter-spacing:.04em;margin:4px 0}
.cd{display:flex;justify-content:center;gap:0;margin:26px 0 8px}
.cd div{padding:0 16px;border-inline-start:1px solid var(--gold)}
.cd div:first-child{border:none}
.cd b{display:block;font-size:32px;font-weight:600;color:var(--wine);font-variant-numeric:tabular-nums}
.cd span{font-size:14px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
body.ar .cd span{letter-spacing:0;font-size:17px;text-transform:none}
#greet{font-size:24px;color:var(--wine);font-style:italic;min-height:32px;margin-top:10px}
.btn{display:inline-block;margin:8px 4px 0;padding:10px 24px;border:1px solid var(--wine);color:var(--wine);background:transparent;text-decoration:none;font:inherit;font-size:18px;letter-spacing:.06em;cursor:pointer}
.btns{margin-top:14px}
.hijri{font-size:18px;color:var(--muted);font-style:italic;margin-bottom:6px}
.det{margin:18px auto;max-width:400px;border:1px solid var(--gold)}
.det div{display:flex;justify-content:space-between;gap:14px;padding:10px 14px;border-bottom:1px solid var(--gold);font-size:19px}
.det div:last-child{border-bottom:none}
.det span{color:var(--muted);font-style:italic}
.det b{font-weight:600;text-align:end}
.prog{list-style:none;padding:0;margin:8px auto;max-width:380px}
.prog li{display:flex;gap:14px;padding:6px 0;font-size:19px;text-align:start;border-bottom:1px dotted var(--gold)}
.prog time{min-width:88px;color:var(--wine);font-weight:600}
</style>
</head>
<body>
<main class="card">
  <svg class="corner tl" viewBox="0 0 46 46" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M2 44V12C2 6 6 2 12 2h32M10 36V16c0-4 2-6 6-6h20M2 2l14 14"/><circle cx="20" cy="20" r="2.5"/></svg>
  <svg class="corner tr" viewBox="0 0 46 46" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M2 44V12C2 6 6 2 12 2h32M10 36V16c0-4 2-6 6-6h20M2 2l14 14"/><circle cx="20" cy="20" r="2.5"/></svg>
  <svg class="corner bl" viewBox="0 0 46 46" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M2 44V12C2 6 6 2 12 2h32M10 36V16c0-4 2-6 6-6h20M2 2l14 14"/><circle cx="20" cy="20" r="2.5"/></svg>
  <svg class="corner br" viewBox="0 0 46 46" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M2 44V12C2 6 6 2 12 2h32M10 36V16c0-4 2-6 6-6h20M2 2l14 14"/><circle cx="20" cy="20" r="2.5"/></svg>
 
  <!-- Language button: not translated -->
  <button class="lang" id="lang" translate="no">English</button>
 
  <!-- Bismillah: Arabic, not translated -->
  <div class="bis" lang="ar" translate="no">بسم الله الرحمن الرحيم</div>
 
  <p class="small" data-k="intro">The families request the honour of your presence at the Katb Ketab of</p>
 
  <!-- Names: not translated -->
  <h1 translate="no"><span data-k="n1">Ibrahim</span><em>&amp;</em><span data-k="n2">Noha</span></h1>
 
  <p class="small" id="fam"></p>
  <div class="rule">❖</div>
  <div class="date" data-k="date">Friday, the 6th of November, 2026</div>
 
  <!-- Hijri date is generated by code: not translated -->
  <div class="hijri" id="hijri" translate="no"></div>
 
  <div class="det" id="det"></div>
  <div class="small" id="progT" style="margin-top:20px"></div>
  <ul class="prog" id="prog"></ul>
 
  <!-- Countdown numbers change every second: not translated -->
  <div class="cd" id="cd">
    <div><b id="d" translate="no">0</b><span data-k="days">Days</span></div>
    <div><b id="h" translate="no">0</b><span data-k="hours">Hours</span></div>
    <div><b id="m" translate="no">0</b><span data-k="mins">Min</span></div>
    <div><b id="s" translate="no">0</b><span data-k="secs">Sec</span></div>
  </div>
 
  <div class="rule">❖</div>
  <p class="small" data-k="note">Your presence and prayers will make our day complete.</p>
  <div id="greet"></div>
 
  <div class="btns">
    <a class="btn" id="rsvp" target="_blank" rel="noopener" style="display:none"></a>
    <a class="btn" id="map" target="_blank" rel="noopener" style="display:none"></a>
    <a class="btn" id="cal" target="_blank" rel="noopener" data-k="cal">Add to calendar</a>
  </div>
</main>
<script>
// ---- Fill these in; empty items are hidden ----
var CONFIG={target:new Date(2026,10,6,18,0,0), // Nov 6, 2026, 6 PM local (countdown only)
 time:{en:"",ar:""}, venue:{en:"",ar:""},
 address:{en:"Ezbet Abu Hassan, Demlo, Benha, Qalyubia",ar:"عزبة أبو حسن، دملو، بنها، القليوبية"},
 dress:{en:"",ar:""}, families:{en:"",ar:""},
 mapUrl:"https://maps.app.goo.gl/m4whfdmpJcXPwXuP8",
 whatsapp:"", // digits with country code, e.g. 201001234567
 program:[] // e.g. [{t:"6:00 PM",en:"Guests arrive",ar:"استقبال الضيوف"}]
};
var T={
 en:{intro:"The families request the honour of your presence at the Katb Ketab of",n1:"Ibrahim",n2:"Noha",date:"Friday, the 6th of November, 2026",days:"Days",hours:"Hours",mins:"Min",secs:"Sec",note:"Your presence and prayers will make our day complete.",cal:"Add to calendar",hi:"Dear ",done:"Today is the day ❖"},
 ar:{intro:"يتشرف أهلهما بدعوتكم لحضور حفل كتب كتاب",n1:"إبراهيم",n2:"نهى",date:"يوم الجمعة ٦ نوفمبر ٢٠٢٦",days:"يوم",hours:"ساعة",mins:"دقيقة",secs:"ثانية",note:"حضوركم ودعواتكم تكمل فرحتنا.",cal:"أضف إلى التقويم",hi:"الفاضل/الفاضلة ",done:"النهارده الفرح ❖"}
};
var L={
 en:{time:"Time",venue:"Venue",addr:"Address",dress:"Dress code",date:"Date",rsvp:"RSVP on WhatsApp",map:"Get directions",prog:"Programme",msg:"will attend the Katb Ketab of Ibrahim & Noha",hj:" AH"},
 ar:{time:"الميعاد",venue:"المكان",addr:"العنوان",dress:"الزي",date:"التاريخ",rsvp:"تأكيد الحضور عبر واتساب",map:"الاتجاهات",prog:"البرنامج",msg:"سيحضر كتب كتاب إبراهيم ونهى",hj:" هـ"}
};
var lang="ar",$=function(i){return document.getElementById(i)};
function pick(o){return o&&o[lang]||""}
 
function details(){
 var t=L[lang],box=$("det");box.innerHTML="";
 function row(k,v){var d=document.createElement("div"),s=document.createElement("span"),b=document.createElement("b");s.textContent=k;b.textContent=v;d.appendChild(s);d.appendChild(b);box.appendChild(d)}
 row(t.date,T[lang].date.replace(/^[^,،]*[,،]\s*/,""));
 if(pick(CONFIG.time))row(t.time,pick(CONFIG.time));
 if(pick(CONFIG.venue))row(t.venue,pick(CONFIG.venue));
 if(pick(CONFIG.address))row(t.addr,pick(CONFIG.address));
 if(pick(CONFIG.dress))row(t.dress,pick(CONFIG.dress));
 $("fam").textContent=pick(CONFIG.families);
 var ul=$("prog");ul.innerHTML="";
 CONFIG.program.forEach(function(p){var li=document.createElement("li"),tm=document.createElement("time"),tx=document.createElement("span");tm.textContent=p.t;tx.textContent=p[lang];li.appendChild(tm);li.appendChild(tx);ul.appendChild(li)});
 $("progT").textContent=CONFIG.program.length?t.prog:"";
 var mp=$("map");mp.style.display=CONFIG.mapUrl?"":"none";mp.href=CONFIG.mapUrl||"#";mp.textContent=t.map;
 $("rsvp").style.display=CONFIG.whatsapp?"":"none";$("rsvp").textContent=t.rsvp;
 var h="";try{h=new Intl.DateTimeFormat(lang==="ar"?"ar-EG-u-ca-islamic-umalqura":"en-u-ca-islamic-umalqura",{day:"numeric",month:"long",year:"numeric"}).format(new Date(2026,10,6))}catch(e){}
 $("hijri").textContent=h?h.replace(/\s?(AH|هـ)$/,"")+t.hj:"";
 greet();
}
 
function render(){
 var t=T[lang];
 document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
 document.body.className=lang==="ar"?"ar":"";
 document.querySelectorAll("[data-k]").forEach(function(e){e.textContent=t[e.dataset.k]});
 $("lang").textContent=lang==="ar"?"English":"عربي";
 greet();tick();details();
}
 
function guestName(){
 var h=location.hash.slice(1);
 if(h.charAt(0)!=="g"||h.length<3||h.length%2===0||!/^[0-9a-f]+$/i.test(h.slice(1)))return "";
 try{var b=h.slice(1).match(/../g).map(function(x){return parseInt(x,16)});return new TextDecoder().decode(new Uint8Array(b)).slice(0,40)}catch(e){return ""}
}
 
// "Dear" can be translated; the guest's name is protected with translate="no"
function greet(){
 var v=guestName(),g=$("greet");
 g.textContent="";
 if(v){
  g.appendChild(document.createTextNode(T[lang].hi));
  var s=document.createElement("span");
  s.setAttribute("translate","no");
  s.textContent=v;
  g.appendChild(s);
 }
 var msg=((v?v+" ":"")+L[lang].msg).trim();
 $("rsvp").href="https://wa.me/"+(CONFIG.whatsapp||"")+"?text="+encodeURIComponent(msg);
}
 
function tick(){
 var diff=CONFIG.target-new Date();
 if(diff<=0){$("cd").style.display="none";$("greet").textContent=T[lang].done;return}
 var f=function(n){return lang==="ar"?n.toLocaleString("ar-EG"):n};
 $("d").textContent=f(Math.floor(diff/864e5));
 $("h").textContent=f(Math.floor(diff/36e5)%24);
 $("m").textContent=f(Math.floor(diff/6e4)%60);
 $("s").textContent=f(Math.floor(diff/1e3)%60);
}
 
$("lang").onclick=function(){lang=lang==="en"?"ar":"en";render()};
window.addEventListener("hashchange",greet);
$("cal").href="https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent("Ibrahim & Noha – Katb Ketab")+"&dates=20261106/20261107";
setInterval(tick,1000);render();
</script>
</body>
</html>
